<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女優分類系統 Wiki</title>
<script src="wiki-data.js"></script>
<style>
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #1c2128;
  --border:   #30363d;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --accent:   #58a6ff;
  --accent2:  #79c0ff;
  --green:    #3fb950;
  --yellow:   #d29922;
  --orange:   #f0883e;
  --red:      #f85149;
  --purple:   #bc8cff;
  --sidebar:  260px;
  --toc:      200px;
  --header:   52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header ── */
header {
  height: var(--header); flex-shrink: 0; z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
}
header .logo { font-size: 20px; }
header h1 { font-size: 15px; font-weight: 600; }
.badge {
  font-size: 11px; background: #1f3a5f; color: var(--accent);
  border: 1px solid #1f6feb; border-radius: 12px; padding: 2px 8px;
}
.search-wrap { margin-left: auto; position: relative; }
#search {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: 5px 10px 5px 30px; font-size: 13px;
  width: 220px; outline: none; transition: border-color 0.15s;
}
#search:focus { border-color: var(--accent); }
.search-icon {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 13px; pointer-events: none;
}
#search-results {
  position: absolute; right: 0; top: 36px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  width: 360px; max-height: 340px; overflow-y: auto; z-index: 100;
  display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.sr-item {
  padding: 9px 13px; cursor: pointer; border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: var(--surface2); }
.sr-title { font-size: 13px; color: var(--accent); font-weight: 500; }
.sr-excerpt { font-size: 12px; color: var(--muted); margin-top: 3px; }
mark { background: #3d2b00; color: #e3b341; border-radius: 2px; padding: 0 2px; }

/* ── Layout ── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
aside {
  width: var(--sidebar); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto; padding-bottom: 32px;
}
.nav-section { padding: 12px 8px 4px; }
.nav-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); padding: 4px 8px 6px;
}
.nav-item {
  display: block; padding: 5px 12px; border-radius: 6px; cursor: pointer;
  font-size: 13px; color: var(--muted); transition: all .12s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: #1f3a5f; color: var(--accent); font-weight: 500; }

/* ── Main scroll area ── */
.content-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
main {
  flex: 1; max-width: 820px; padding: 28px 36px 60px;
  min-width: 0; /* prevent overflow */
}

/* ── ToC ── */
#toc-panel {
  width: var(--toc); flex-shrink: 0; padding: 24px 12px;
  overflow-y: auto; display: none;
}
@media (min-width: 1200px) { #toc-panel { display: block; } }
#toc-panel .toc-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; padding: 0 4px;
}
.toc-item {
  display: block; font-size: 12px; color: var(--muted);
  padding: 3px 4px 3px 12px; border-radius: 4px; cursor: pointer;
  transition: color .12s; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toc-item:hover { color: var(--text); }
.toc-item.toc-h3 { padding-left: 22px; font-size: 11px; }
.toc-item.active { color: var(--accent); }

/* ── Breadcrumb & toolbar ── */
.page-header {
  display: flex; align-items: center; margin-bottom: 20px;
  gap: 12px; flex-wrap: wrap;
}
.breadcrumb { font-size: 12px; color: var(--muted); flex: 1; }
.breadcrumb span { color: var(--accent); }
.btn-copy {
  font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: var(--surface2); color: var(--muted);
  border: 1px solid var(--border); transition: all .15s; white-space: nowrap;
}
.btn-copy:hover { background: var(--surface); color: var(--text); border-color: var(--accent); }
.btn-copy.copied { color: var(--green); border-color: var(--green); }

/* ── Markdown content ── */
#content h1 { font-size: 26px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; }
#content h2 { font-size: 19px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 32px 0 12px; }
#content h3 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; color: var(--accent2); }
#content h4 { font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#content p { font-size: 14px; line-height: 1.75; margin-bottom: 14px; }
#content ul,#content ol { padding-left: 22px; margin-bottom: 14px; font-size: 14px; line-height: 1.8; }
#content li { margin-bottom: 3px; }
#content a { color: var(--accent); text-decoration: none; }
#content a:hover { text-decoration: underline; }
#content strong { color: var(--accent2); }
#content em { color: var(--text); font-style: italic; }
#content del { color: var(--muted); }
#content code {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
  font-size: 12px; font-family: "SFMono-Regular", Consolas, monospace;
}
#content pre {
  position: relative; background: #0d1117;
  border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; overflow-x: auto; margin: 14px 0;
}
#content pre code {
  background: none; border: none; padding: 0;
  font-size: 13px; line-height: 1.6; display: block;
}
.code-lang {
  position: absolute; right: 10px; top: 8px;
  font-size: 11px; color: var(--muted); font-family: monospace;
  text-transform: lowercase; user-select: none;
}
/* Minimal syntax highlighting */
.kw  { color: #ff7b72; }
.str { color: #a5d6ff; }
.cmt { color: #8b949e; font-style: italic; }
.num { color: #79c0ff; }
.fn  { color: #d2a8ff; }
.typ { color: #ffa657; }

#content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
#content th { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; font-weight: 600; text-align: left; }
#content td { border: 1px solid var(--border); padding: 7px 12px; }
#content tr:nth-child(even) td { background: #0d1117; }
#content blockquote {
  border-left: 3px solid var(--border); margin: 14px 0;
  padding: 8px 16px; background: var(--surface); border-radius: 0 6px 6px 0;
  color: var(--muted); font-size: 13px;
}
#content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

/* GitHub Alerts */
.alert {
  border-left: 4px solid; border-radius: 0 6px 6px 0;
  padding: 10px 16px; margin: 14px 0;
  background: var(--surface);
}
.alert-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.alert-note    { border-color: #1f6feb; }
.alert-tip     { border-color: #238636; }
.alert-warning { border-color: #9e6a03; }
.alert-caution { border-color: #da3633; }
.alert-important { border-color: #8957e5; }
.alert-note .alert-title    { color: #58a6ff; }
.alert-tip .alert-title     { color: #3fb950; }
.alert-warning .alert-title { color: #d29922; }
.alert-caution .alert-title { color: #f85149; }
.alert-important .alert-title { color: #bc8cff; }

/* Backlinks */
#backlinks {
  margin-top: 48px; padding-top: 20px;
  border-top: 1px solid var(--border);
}
.backlinks-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
.backlink-item {
  display: inline-block; font-size: 12px; color: var(--accent);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 10px; margin: 3px 4px 3px 0;
  cursor: pointer; transition: border-color .12s;
}
.backlink-item:hover { border-color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* Loading */
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); gap: 10px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <span class="logo">📚</span>
  <h1>女優分類系統 Wiki</h1>
  <span class="badge">v6.0.0</span>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search" type="text" placeholder="搜尋…" autocomplete="off">
    <div id="search-results"></div>
  </div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>

  <div class="content-wrap">
    <main>
      <div class="page-header">
        <div class="breadcrumb" id="breadcrumb"></div>
        <button class="btn-copy" id="btn-copy" onclick="copyMd()">📋 複製 MD</button>
      </div>
      <div id="content"><div class="loading"><div class="spinner"></div> 載入中…</div></div>
      <div id="backlinks"></div>
    </main>
  </div>

  <div id="toc-panel">
    <div class="toc-title">目錄</div>
    <div id="toc-list"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// Markdown Parser（零依賴）
// ═══════════════════════════════════════════════════

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function highlight(code, lang) {
  let s = esc(code);
  const L = (lang || '').toLowerCase();
  if (L === 'go') {
    s = s.replace(/\/\/.*/g, m => `<span class="cmt">${m}</span>`);
    s = s.replace(/"(?:[^"\\]|\\.)*"/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/`(?:[^`\\]|\\.)*`/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/\b(func|package|import|type|struct|interface|var|const|return|if|else|for|range|switch|case|default|break|continue|defer|go|chan|map|nil|true|false|error|string|int|int64|int32|bool|any|byte|uint|float64|append|len|make|new|delete)\b/g, '<span class="kw">$1</span>');
    s = s.replace(/\b([A-Z][A-Za-z0-9]*)\b/g, '<span class="typ">$1</span>');
    s = s.replace(/\b([a-z][A-Za-z0-9]*)\s*\(/g, '<span class="fn">$1</span>(');
    s = s.replace(/\b([0-9]+)\b/g, '<span class="num">$1</span>');
  } else if (L === 'python' || L === 'py') {
    s = s.replace(/#.*/g, m => `<span class="cmt">${m}</span>`);
    s = s.replace(/"(?:[^"\\]|\\.)*"/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/'(?:[^'\\]|\\.)*'/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/\b(def|class|import|from|return|if|elif|else|for|while|in|not|and|or|True|False|None|try|except|with|as|pass|break|continue|raise|lambda|yield|self|super|print|len|range|isinstance|type|dict|list|set|tuple|str|int|float|bool|open)\b/g, '<span class="kw">$1</span>');
    s = s.replace(/\b([A-Z][A-Za-z0-9]*)\b/g, '<span class="typ">$1</span>');
    s = s.replace(/\b([0-9]+)\b/g, '<span class="num">$1</span>');
  } else if (L === 'bash' || L === 'sh' || L === 'shell') {
    s = s.replace(/#.*/g, m => `<span class="cmt">${m}</span>`);
    s = s.replace(/"(?:[^"\\]|\\.)*"/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/\b(cd|ls|git|go|python|python3|echo|mkdir|cp|mv|rm|cat|grep|find|chmod|sudo|export|source|if|then|fi|else|for|do|done|while|function|return|set|unset)\b/g, '<span class="kw">$1</span>');
  } else if (L === 'json') {
    s = s.replace(/"(?:[^"\\]|\\.)*"\s*:/g, m => `<span class="kw">${m}</span>`);
    s = s.replace(/:\s*"(?:[^"\\]|\\.)*"/g, m => {
      const colon = m.match(/^:\s*/)[0];
      return colon + `<span class="str">${m.slice(colon.length)}</span>`;
    });
    s = s.replace(/\b(true|false|null)\b/g, '<span class="typ">$1</span>');
    s = s.replace(/\b([0-9]+\.?[0-9]*)\b/g, '<span class="num">$1</span>');
  } else if (L === 'typescript' || L === 'ts' || L === 'javascript' || L === 'js' || L === 'tsx' || L === 'jsx') {
    s = s.replace(/\/\/.*/g, m => `<span class="cmt">${m}</span>`);
    s = s.replace(/"(?:[^"\\]|\\.)*"/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/'(?:[^'\\]|\\.)*'/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/`(?:[^`\\]|\\.)*`/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/\b(const|let|var|function|return|if|else|for|while|in|of|import|export|from|class|extends|new|this|async|await|try|catch|throw|typeof|instanceof|true|false|null|undefined|void|string|number|boolean|any|interface|type)\b/g, '<span class="kw">$1</span>');
    s = s.replace(/\b([A-Z][A-Za-z0-9]*)\b/g, '<span class="typ">$1</span>');
    s = s.replace(/\b([0-9]+)\b/g, '<span class="num">$1</span>');
  }
  return s;
}

function inl(s) {
  s = esc(s);
  // `inline code`
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // **bold**
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // *italic*
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // ~~strikethrough~~
  s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // [text](url)
  s = s.replace(/\[([^\]]*)\]\(([^)]*)\)/g, (_, text, href) => {
    if (href.endsWith('.md')) {
      return `<a href="#" class="md-link" data-href="${esc(href)}">${text}</a>`;
    }
    return `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
  });
  return s;
}

function parseRow(row) {
  const cells = row.split('|');
  // remove first empty (before leading |) and last empty (after trailing |)
  return cells.slice(1, cells[cells.length-1].trim() === '' ? -1 : undefined).map(c => c.trim());
}

function isSepRow(row) {
  return /^\|[\s|:=-]+\|$/.test(row.trim());
}

function parse(md) {
  const lines = md.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // ── Fenced code block ──
    const fenceM = line.match(/^(`{3,}|~{3,})(.*)/);
    if (fenceM) {
      const fence = fenceM[1];
      const lang  = fenceM[2].trim();
      const code  = [];
      i++;
      while (i < lines.length && !lines[i].startsWith(fence)) {
        code.push(lines[i]);
        i++;
      }
      i++; // closing fence
      const highlighted = highlight(code.join('\n'), lang);
      const langLabel = lang ? `<span class="code-lang">${esc(lang)}</span>` : '';
      html += `<pre>${langLabel}<code>${highlighted}</code></pre>`;
      continue;
    }

    // ── Heading ──
    const hm = line.match(/^(#{1,4}) (.+)/);
    if (hm) {
      const lvl = hm[1].length;
      const txt = hm[2].trim();
      const id  = 'h-' + txt.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g,'');
      html += `<h${lvl} id="${id}">${inl(txt)}</h${lvl}>`;
      i++; continue;
    }

    // ── HR ──
    if (line.match(/^[-*_]{3,}$/) && line.trim().replace(/[\s-*_]/g,'') === '') {
      html += '<hr>'; i++; continue;
    }

    // ── GitHub Alert or Blockquote ──
    if (line.startsWith('> ')) {
      const bqLines = [];
      while (i < lines.length && (lines[i].startsWith('> ') || lines[i] === '>')) {
        bqLines.push(lines[i].replace(/^> ?/, ''));
        i++;
      }
      const alertM = bqLines[0] && bqLines[0].match(/^\[!(NOTE|TIP|WARNING|CAUTION|IMPORTANT)\]/i);
      if (alertM) {
        const type = alertM[1].toUpperCase();
        const icons = { NOTE:'ℹ️', TIP:'💡', WARNING:'⚠️', CAUTION:'🔴', IMPORTANT:'❗' };
        const body = parse(bqLines.slice(1).join('\n'));
        html += `<div class="alert alert-${type.toLowerCase()}">
          <div class="alert-title">${icons[type]} ${type}</div>
          <div>${body}</div></div>`;
      } else {
        html += `<blockquote>${parse(bqLines.join('\n'))}</blockquote>`;
      }
      continue;
    }

    // ── Table ──
    if (line.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith('|')) {
        rows.push(lines[i]);
        i++;
      }
      if (rows.length < 2) {
        html += `<p>${inl(rows.join(' '))}</p>`;
        continue;
      }
      const sepIdx = rows.findIndex(r => isSepRow(r));
      const headerIdx = sepIdx > 0 ? sepIdx - 1 : 0;
      const dataStart = sepIdx >= 0 ? sepIdx + 1 : 1;
      const headerCells = parseRow(rows[headerIdx]).map(c => `<th>${inl(c)}</th>`).join('');
      const bodyRows = rows.slice(dataStart)
        .filter(r => !isSepRow(r))
        .map(r => `<tr>${parseRow(r).map(c => `<td>${inl(c)}</td>`).join('')}</tr>`)
        .join('');
      html += `<table><thead><tr>${headerCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
      continue;
    }

    // ── Unordered list ──
    if (line.match(/^[-*+] /)) {
      const items = [];
      while (i < lines.length && lines[i].match(/^[-*+] /)) {
        items.push(`<li>${inl(lines[i].replace(/^[-*+] /, '').trim())}</li>`);
        i++;
      }
      html += `<ul>${items.join('')}</ul>`;
      continue;
    }

    // ── Ordered list ──
    if (line.match(/^\d+\. /)) {
      const items = [];
      while (i < lines.length && lines[i].match(/^\d+\. /)) {
        items.push(`<li>${inl(lines[i].replace(/^\d+\. /, '').trim())}</li>`);
        i++;
      }
      html += `<ol>${items.join('')}</ol>`;
      continue;
    }

    // ── Empty line ──
    if (line.trim() === '') { i++; continue; }

    // ── Paragraph ──
    const para = [];
    const blockStart = /^(#{1,4} |```|~~~|> |\||[-*+] |\d+\. |---)/;
    while (i < lines.length && lines[i].trim() !== '' && !blockStart.test(lines[i])) {
      para.push(lines[i]);
      i++;
    }
    if (para.length) html += `<p>${para.map(inl).join(' ')}</p>`;
  }
  return html;
}

function extractTitle(md) {
  const m = md.match(/^#\s+(.+)/m);
  return m ? m[1].trim() : null;
}

// ═══════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════
let currentFile = null;

// ═══════════════════════════════════════════════════
// Nav builder（自動從 WIKI_DATA 產生，不需手動維護）
// ═══════════════════════════════════════════════════
const SECTION_META = [
  { key: 'root',         title: '📖 索引',     match: f => !f.includes('/'),       order: ['index.md','log.md'] },
  { key: 'architecture', title: '🏛️ 架構',     match: f => f.startsWith('architecture/') },
  { key: 'patterns',     title: '📐 開發模式',  match: f => f.startsWith('patterns/')     },
  { key: 'pitfalls',     title: '🪲 踩坑紀錄',  match: f => f.startsWith('pitfalls/')     },
];

function buildSidebar() {
  const data = window.WIKI_DATA || {};
  const aside = document.getElementById('sidebar');
  aside.innerHTML = '';

  for (const sec of SECTION_META) {
    let files = Object.keys(data).filter(sec.match);
    if (!files.length) continue;

    // Sort: predefined order first, then alphabetical by title
    if (sec.order) {
      files.sort((a, b) => {
        const ia = sec.order.indexOf(a), ib = sec.order.indexOf(b);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return  1;
        return a.localeCompare(b);
      });
    } else {
      files.sort((a, b) => {
        const ta = extractTitle(data[a]) || a;
        const tb = extractTitle(data[b]) || b;
        return ta.localeCompare(tb, 'zh-TW');
      });
    }

    const secEl = document.createElement('div');
    secEl.className = 'nav-section';
    secEl.innerHTML = `<div class="nav-label">${sec.title}</div>`;

    for (const file of files) {
      const title = extractTitle(data[file]) || file;
      const el = document.createElement('div');
      el.className = 'nav-item';
      el.dataset.file = file;
      el.title = title;
      el.textContent = title;
      el.onclick = () => loadPage(file);
      secEl.appendChild(el);
    }
    aside.appendChild(secEl);
  }
}

// ═══════════════════════════════════════════════════
// Page loader
// ═══════════════════════════════════════════════════
function loadPage(file) {
  const data = window.WIKI_DATA || {};
  const md = data[file];
  if (!md) {
    document.getElementById('content').innerHTML =
      `<div style="color:var(--red);padding:20px">❌ 找不到：${esc(file)}</div>`;
    return;
  }

  currentFile = file;

  // Sidebar highlight
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.nav-item[data-file="${CSS.escape(file)}"]`);
  if (activeEl) {
    activeEl.classList.add('active');
    activeEl.scrollIntoView({ block: 'nearest' });
  }

  // Breadcrumb
  const parts = file.replace('.md','').split('/');
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = parts.length > 1
    ? `wiki / <span>${parts[0]}</span> / ${parts[parts.length-1]}`
    : `wiki / <span>${parts[0]}</span>`;

  // Render content
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = parse(md);

  // Wire up .md links
  contentEl.querySelectorAll('a.md-link').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const href = a.dataset.href;
      const resolved = resolveFile(file, href);
      if (window.WIKI_DATA[resolved]) loadPage(resolved);
    });
  });

  // ToC
  renderToc(contentEl);

  // Backlinks
  renderBacklinks(file);

  // Scroll to top
  document.querySelector('.content-wrap').scrollTo(0, 0);
}

function resolveFile(currentFile, relHref) {
  const base = currentFile.includes('/') ? currentFile.split('/').slice(0,-1).join('/') : '';
  const target = (base ? base + '/' : '') + relHref;
  // Resolve ../
  const parts = target.split('/');
  const out = [];
  for (const p of parts) {
    if (p === '..') out.pop();
    else if (p !== '.') out.push(p);
  }
  return out.join('/');
}

// ═══════════════════════════════════════════════════
// ToC
// ═══════════════════════════════════════════════════
function renderToc(contentEl) {
  const tocList = document.getElementById('toc-list');
  const headings = contentEl.querySelectorAll('h2, h3');
  if (headings.length < 3) {
    tocList.innerHTML = '<div style="font-size:11px;color:var(--muted)">（本頁無目錄）</div>';
    return;
  }
  tocList.innerHTML = '';
  headings.forEach(h => {
    const el = document.createElement('div');
    el.className = 'toc-item' + (h.tagName === 'H3' ? ' toc-h3' : '');
    el.textContent = h.textContent;
    el.onclick = () => {
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    tocList.appendChild(el);
  });

  // Scroll spy
  const contentWrap = document.querySelector('.content-wrap');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        tocList.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
        const matched = [...tocList.querySelectorAll('.toc-item')]
          .find(el => el.textContent === entry.target.textContent);
        if (matched) matched.classList.add('active');
      }
    });
  }, { root: contentWrap, threshold: 0.5 });

  headings.forEach(h => observer.observe(h));
}

// ═══════════════════════════════════════════════════
// Backlinks
// ═══════════════════════════════════════════════════
function renderBacklinks(file) {
  const blEl = document.getElementById('backlinks');
  const data = window.WIKI_DATA || {};
  const fname = file.split('/').pop(); // e.g. "database.md"
  const referring = [];

  for (const [key, content] of Object.entries(data)) {
    if (key === file) continue;
    // Look for .md links referencing this file
    if (content.includes(fname) && content.includes('.md')) {
      const mdLinkRe = new RegExp(`\\[([^\\]]+)\\]\\([^)]*${fname.replace('.','\\.')}[^)]*\\)`);
      if (mdLinkRe.test(content)) {
        referring.push({ file: key, title: extractTitle(content) || key });
      }
    }
  }

  if (!referring.length) { blEl.innerHTML = ''; return; }

  blEl.innerHTML = `<div class="backlinks-title">⬅ 被以下頁面引用（${referring.length}）</div>
    ${referring.map(r =>
      `<span class="backlink-item" data-file="${esc(r.file)}">${esc(r.title)}</span>`
    ).join('')}`;

  blEl.querySelectorAll('.backlink-item').forEach(el => {
    el.addEventListener('click', () => loadPage(el.dataset.file));
  });
}

// ═══════════════════════════════════════════════════
// Copy MD
// ═══════════════════════════════════════════════════
function copyMd() {
  const btn = document.getElementById('btn-copy');
  const md = (window.WIKI_DATA || {})[currentFile];
  if (!md) return;

  navigator.clipboard.writeText(md).then(() => {
    btn.textContent = '✅ 已複製';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 複製 MD'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = md;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ 已複製';
    setTimeout(() => { btn.textContent = '📋 複製 MD'; }, 2000);
  });
}

// ═══════════════════════════════════════════════════
// Search
// ═══════════════════════════════════════════════════
const searchEl   = document.getElementById('search');
const resultsEl  = document.getElementById('search-results');

searchEl.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { resultsEl.style.display = 'none'; return; }

  const data = window.WIKI_DATA || {};
  const hi = s => s.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
  const results = [];

  for (const [file, content] of Object.entries(data)) {
    const title = extractTitle(content) || file;
    const lower = content.toLowerCase();
    const idx   = lower.indexOf(q);
    const titleMatch = title.toLowerCase().includes(q);
    if (idx === -1 && !titleMatch) continue;
    const excerpt = idx !== -1
      ? content.substring(Math.max(0, idx - 40), idx + 100).replace(/\n/g,' ').replace(/#+/g,'')
      : '';
    results.push({ file, title, titleHtml: hi(title), excerptHtml: hi(excerpt) });
    if (results.length >= 8) break;
  }

  if (!results.length) { resultsEl.style.display = 'none'; return; }

  resultsEl.innerHTML = results.map(r => `
    <div class="sr-item" data-file="${esc(r.file)}">
      <div class="sr-title">${r.titleHtml}</div>
      ${r.excerptHtml ? `<div class="sr-excerpt">${r.excerptHtml}…</div>` : ''}
    </div>`).join('');

  resultsEl.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', () => {
      loadPage(el.dataset.file);
      resultsEl.style.display = 'none';
      searchEl.value = '';
    });
  });

  resultsEl.style.display = 'block';
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) resultsEl.style.display = 'none';
});

// ── Keyboard shortcut: / to focus search ──
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
  if (e.key === 'Escape') { resultsEl.style.display = 'none'; searchEl.blur(); }
});

// ═══════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════
buildSidebar();

if (window.WIKI_DATA && Object.keys(window.WIKI_DATA).length) {
  // Load index.md first, fallback to first available
  const first = window.WIKI_DATA['index.md'] ? 'index.md'
    : Object.keys(window.WIKI_DATA)[0];
  loadPage(first);
} else {
  document.getElementById('content').innerHTML =
    '<div style="color:var(--red);padding:20px">❌ 未找到 wiki-data.js，請先執行：python wiki/gen_data.py</div>';
}
</script>
