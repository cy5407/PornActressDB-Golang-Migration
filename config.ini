[database]
json_data_dir = data/json_db
database_path = C:/Users/cy540/Documents/ActressClassifier/actress_database.db

[paths]
default_input_dir = W:/Downloads

[search]
batch_size = 10
thread_count = 5
batch_delay = 2.0
request_timeout = 20
avwiki_concurrent_enabled = true
avwiki_max_concurrent = 15

[classification]
mode = interactive
auto_apply_preferences = true

[cache]
ttl_days = 7
max_size_mb = 500
auto_cleanup_on_exit = true

[go_integration]
# 是否啟用 Go 加速（掃描、移動等操作）
enabled = true

# classifier.exe 路徑（留空自動偵測）
exe_path = 

# 掃描並發數
scan_workers = 10

# 移動操作衝突策略: skip, overwrite, rename
move_conflict_strategy = skip

# 是否啟用操作日誌
enable_operation_log = true

# 操作日誌目錄
log_dir = logs

