# Codecov 覆蓋率設定
# Task 3: 補充測試環境配置

coverage:
  status:
    project:
      default:
        target: 80%          # 整體覆蓋率目標 80%
        threshold: 2%        # 允許下降最多 2%
    patch:
      default:
        target: 70%          # 新增程式碼覆蓋率目標 70%

flags:
  go-unit:
    paths:
      - pkg/
    carryforward: true
  python-unit:
    paths:
      - src/
    carryforward: true
  integration:
    paths:
      - src/
      - pkg/
    carryforward: false

ignore:
  - "tools/"
  - "docs/"
  - "**/*_test.go"
  - "tests/"
  - "*.spec"
  - "build/"
  - "dist/"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true      # 只在覆蓋率有變化時留言
