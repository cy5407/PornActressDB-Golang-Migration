sonar.projectKey=cy5407_PornActressDB-Golang-Migration
sonar.organization=cy5407
sonar.sourceEncoding=UTF-8

sonar.sources=cmd,pkg,src
sonar.tests=cmd,pkg,tests
sonar.test.inclusions=**/*_test.go,tests/**/*.py

sonar.exclusions=**/*_test.go,**/__pycache__/**,**/.venv/**,**/.pytest_cache/**,**/cache/**,**/logs/**,**/docs/**,**/wiki/**,**/wails-app/**,**/openclaw-review/**,**/security_reports/**,**/*.spec

# 重複字串規則（S1192）不套用測試檔：測試 fixture 字串自說明，提取常數反增認知負擔
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage-python.xml
sonar.go.coverage.reportPaths=coverage-go.out