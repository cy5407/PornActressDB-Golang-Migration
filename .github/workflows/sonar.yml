name: SonarCloud Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'go.mod'
      - 'go.sum'
      - 'sonar-project.properties'
      - '.github/workflows/sonar.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build classifier CLI
        run: |
          go build -o classifier ./cmd/scanner
          go build -o classifier.exe ./cmd/scanner
          chmod +x classifier classifier.exe

      - name: Run Go tests with coverage
        run: go test ./pkg/... -coverprofile=coverage-go.out

      - name: Run Python tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/integration \
            --ignore=tests/test_scanner_integration.py \
            --ignore=tests/test_go_accelerated_db.py \
            -m "not integration" \
            --cov=src \
            --cov-report=xml:coverage-python.xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.verbose=true