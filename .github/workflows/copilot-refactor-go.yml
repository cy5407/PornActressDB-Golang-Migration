name: Copilot Go Extractor Refactor

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: copilot-refactor-extractor
  cancel-in-progress: false

jobs:
  refactor-extractor:
    name: Refactor pkg/extractor with Copilot CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Baseline extractor tests
        run: go test ./pkg/extractor -v

      - name: Run Copilot CLI refactor
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        shell: bash
        run: |
          prompt="$(cat .github/prompts/refactor-pkg-extractor.md)"

          copilot -p "$prompt" \
            --autopilot \
            --max-autopilot-continues 3 \
            --allow-tool='shell' \
            --allow-tool='write' \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(git commit)' \
            --deny-tool='shell(gh)' \
            --deny-tool='shell(rm)' \
            --no-ask-user

      - name: Guard refactor scope
        id: scope
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only)

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${changed_files[@]}" > changed-files.txt

          out_of_scope="$(printf '%s\n' "${changed_files[@]}" | grep -v '^pkg/extractor/' || true)"
          if [ -n "$out_of_scope" ]; then
            echo "Out-of-scope changes detected:" >&2
            printf '%s\n' "$out_of_scope" >&2
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Verify extractor tests after refactor
        if: steps.scope.outputs.has_changes == 'true'
        run: |
          go test ./pkg/extractor -v
          go test ./pkg/... -v

      - name: Add no-change summary
        if: steps.scope.outputs.has_changes != 'true'
        shell: bash
        run: |
          {
            echo "## Copilot extractor refactor"
            echo
            echo "- Scope: \`pkg/extractor/**\`"
            echo "- Result: no safe changes were proposed"
            echo "- Baseline test: \`go test ./pkg/extractor -v\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add change summary
        if: steps.scope.outputs.has_changes == 'true'
        shell: bash
        run: |
          {
            echo "## Copilot extractor refactor"
            echo
            echo "- Scope: \`pkg/extractor/**\`"
            echo "- Result: scoped changes passed validation"
            echo
            echo "### Changed files"
            git diff --name-only -- pkg/extractor | sed 's#^#- `#; s#$#`#'
            echo
            echo "### Diff stat"
            echo '```text'
            git diff --stat -- pkg/extractor
            echo '```'
            echo
            echo "### Validation"
            echo "- \`go test ./pkg/extractor -v\`"
            echo "- \`go test ./pkg/... -v\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update draft pull request
        id: create_pr
        if: steps.scope.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          branch: copilot/refactor-extractor
          delete-branch: false
          draft: true
          add-paths: |
            pkg/extractor
          commit-message: "refactor: tighten pkg/extractor internals"
          title: "refactor: Copilot cleanup for pkg/extractor"
          body: |
            ## Summary
            - AI-assisted internal refactor for `pkg/extractor`
            - Scope is intentionally limited to `pkg/extractor/**`
            - Generated by GitHub Actions + Copilot CLI

            ## Validation
            - `go test ./pkg/extractor -v`
            - `go test ./pkg/... -v`
            - workflow fails if files outside `pkg/extractor/**` are modified

            ## Review notes
            - This PR stays in draft on purpose.
            - Please verify behavior and regex extraction compatibility before merge.

      - name: Add pull request summary
        if: steps.create_pr.outputs.pull-request-url != ''
        shell: bash
        run: |
          {
            echo
            echo "### Pull request"
            echo "- [Draft PR](${{ steps.create_pr.outputs.pull-request-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
