name: Copilot Python to Go Migration Refactor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: copilot-refactor-extractor
  cancel-in-progress: false

jobs:
  refactor-extractor:
    name: Advance Python-to-Go migration with Copilot CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Switch to work branch (create from main if needed)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin copilot/migration-work | grep -q "copilot/migration-work"; then
            git checkout copilot/migration-work
            # rebase onto latest main to pick up user changes
            git rebase origin/main || {
              echo "⚠️ Rebase conflict detected, resetting work branch to main"
              git rebase --abort
              git reset --hard origin/main
            }
          else
            echo "🆕 Creating new work branch from main"
            git checkout -b copilot/migration-work
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Baseline Go package tests
        run: go test ./pkg/... -v

      - name: Run Copilot CLI migration refactor
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        shell: bash
        run: |
          prompt="$(cat .github/prompts/refactor-python-to-go-migration.md)"

          copilot -p "$prompt" \
            --autopilot \
            --max-autopilot-continues 3 \
            --allow-tool='shell' \
            --allow-tool='write' \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(git commit)' \
            --deny-tool='shell(gh)' \
            --deny-tool='shell(rm)' \
            --no-ask-user

      - name: Guard migration scope
        id: scope
        shell: bash
        run: |
          # 同時偵測「修改的追蹤檔案」和「新增的未追蹤檔案」
          mapfile -t changed_files < <({ git diff --name-only; git ls-files --others --exclude-standard; })

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          out_of_scope="$(printf '%s\n' "${changed_files[@]}" | grep -v -E '^(pkg/|cmd/scanner/|src/services/go_api/|src/services/go_bridge(_test)?\.py|src/services/go_runner\.py|src/models/go_accelerated[_a-z]*\.py|src/models/(extractor|studio)\.py|src/utils/(scanner|file_mover)\.py|tests/|\.github/prompts/)' || true)"
          if [ -n "$out_of_scope" ]; then
            echo "Out-of-scope changes detected:" >&2
            printf '%s\n' "$out_of_scope" >&2
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Verify migration tests after refactor
        if: steps.scope.outputs.has_changes == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          go test ./pkg/... -v
          python -m pytest tests/ -v --tb=short

      - name: Commit and push to work branch
        if: steps.scope.outputs.has_changes == 'true'
        shell: bash
        run: |
          # stage only allowed paths
          git add \
            pkg cmd/scanner \
            src/services/go_api \
            src/services/go_bridge.py src/services/go_runner.py \
            src/models/go_accelerated_db.py src/models/go_accelerated_studio.py \
            src/models/extractor.py src/models/studio.py \
            src/utils/scanner.py src/utils/file_mover.py \
            tests .github/prompts 2>/dev/null || true

          changed_list="$(git diff --cached --name-only | sed 's/^/- /' | head -20)"
          commit_msg="$(printf 'refactor: advance python-to-go migration\n\n%s' "$changed_list")"
          git commit -m "$commit_msg"

          git push --force-with-lease origin copilot/migration-work

      - name: Add no-change summary
        if: steps.scope.outputs.has_changes != 'true'
        shell: bash
        run: |
          {
            echo "## Copilot Python-to-Go migration refactor"
            echo
            echo "- Branch: \`copilot/migration-work\`"
            echo "- Result: no safe changes were proposed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add change summary
        if: steps.scope.outputs.has_changes == 'true'
        shell: bash
        run: |
          {
            echo "## Copilot Python-to-Go migration refactor"
            echo
            echo "- Branch: \`copilot/migration-work\`"
            echo "- Result: changes committed directly to work branch"
            echo
            echo "### Changed files"
            git diff HEAD~1 --name-only 2>/dev/null | sed 's#^#- `#; s#$#`#' || echo "- (see branch)"
            echo
            echo "### Diff stat"
            echo '```text'
            git diff HEAD~1 --stat 2>/dev/null || echo "(see branch)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
