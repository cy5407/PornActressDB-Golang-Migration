name: Python Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'requirements.txt'
      - 'pyproject.toml'

jobs:
  python-unit-test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build classifier CLI
        run: |
          go build -o classifier.exe ./cmd/scanner
          chmod +x classifier.exe

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier.exe
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_go_accelerated_db.py \
            --ignore=tests/test_scanner_integration.py \
            -m "not integration" \
            --cov=src \
            --cov-report=xml:coverage-python.xml \
            --cov-report=term-missing

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage-python.xml
          flags: python-unit
          name: python-unit-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
