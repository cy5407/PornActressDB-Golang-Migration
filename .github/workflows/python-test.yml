name: Python Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'

jobs:
  python-unit-test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python unit tests (without Go CLI)
        env:
          PYTHONPATH: ${{ github.workspace }}
          # 模擬 Go CLI 不可用（測試 Python fallback 路徑）
          CLASSIFIER_EXE: ""
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_go_accelerated_db.py \
            --ignore=tests/test_scanner_integration.py \
            -m "not integration" \
            --cov=src \
            --cov-report=xml:coverage-python.xml \
            --cov-report=term-missing

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage-python.xml
          flags: python-unit
          name: python-unit-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
