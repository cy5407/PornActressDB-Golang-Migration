name: Integration Test (Go + Python)

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'requirements.txt'
  pull_request:
    branches: [main]

jobs:
  integration-test:
    name: Go + Python Integration Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # ─── 設定 Go 環境 ───
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # ─── 建置 Go CLI ───
      - name: Build classifier CLI
        run: |
          go build -o classifier ./cmd/scanner
          chmod +x classifier
          echo "✅ classifier 建置成功"
          ./classifier help

      # ─── 執行 Go 測試（含覆蓋率）───
      - name: Run Go tests
        run: |
          go test ./pkg/... -v -race -coverprofile=coverage-go.out
          go tool cover -func=coverage-go.out

      # ─── 設定 Python 環境 ───
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ─── 驗證 Go CLI 可用性 ───
      - name: Verify Go CLI availability
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          os.environ['CLASSIFIER_EXE'] = './classifier'
          from src.services.go_cli import is_available
          available = is_available()
          print(f'Go CLI 可用: {available}')
          if not available:
              raise SystemExit(1)
          "

      # ─── 執行 e2e 整合測試（真實呼叫 classifier.exe）───
      - name: Run e2e integration tests (tests/integration/)
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            --timeout=120

      # ─── 執行聚焦 Go CLI 契約測試 ───
      - name: Run focused Go CLI tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier
        run: |
          python -m pytest tests/integration/test_go_cli_smoke.py tests/integration/test_db_cli_contract.py tests/test_go_cli_contracts.py tests/test_incremental_db.py tests/test_json_database.py \
            -v \
            --tb=short \
            --timeout=120 \
            -p no:cacheprovider

      # ─── 執行完整測試套件（Go CLI 可用時）───
      - name: Run full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage-full.xml \
            --cov-report=term-missing \
            --timeout=120

      # ─── 上傳覆蓋率報告 ───
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-go.out
          flags: go-unit
          name: go-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-full.xml
          flags: integration
          name: python-integration
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
