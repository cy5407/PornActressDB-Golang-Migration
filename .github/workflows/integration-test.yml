name: Integration Test (Go + Python)

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'requirements.txt'
  pull_request:
    branches: [main]

jobs:
  integration-test:
    name: Go + Python Integration Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ─── 設定 Go 環境 ───
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # ─── 建置 Go CLI ───
      - name: Build classifier CLI
        run: |
          go build -o classifier.exe ./cmd/scanner
          chmod +x classifier.exe
          echo "✅ classifier.exe 建置成功"
          ./classifier.exe help || true

      # ─── 執行 Go 測試（含覆蓋率）───
      - name: Run Go tests
        run: |
          go test ./pkg/... -v -race -coverprofile=coverage-go.out
          go tool cover -func=coverage-go.out

      # ─── 設定 Python 環境 ───
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ─── 驗證 Go Bridge 連線 ───
      - name: Verify Go Bridge connectivity
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier.exe
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          os.environ['CLASSIFIER_EXE'] = './classifier.exe'
          try:
              from src.services.go_bridge import GoBridge
              bridge = GoBridge()
              print(f'Go Bridge 可用: {bridge.is_available}')
              if bridge.is_available:
                  print('✅ Go Bridge 連線成功')
              else:
                  print('⚠️ Go Bridge 不可用，但 Python fallback 應正常運作')
          except Exception as e:
              print(f'❌ Go Bridge 初始化錯誤: {e}')
              sys.exit(1)
          "

      # ─── 執行含 Go CLI 的整合測試 ───
      - name: Run integration tests (with Go CLI)
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier.exe
        run: |
          python -m pytest tests/ \
            -v \
            --tb=long \
            -m "integration or go_bridge" \
            --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --timeout=120 \
            || echo "⚠️ 部分整合測試失敗（可能需要特定環境）"

      # ─── 執行完整測試套件（Go CLI 可用時）───
      - name: Run full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLASSIFIER_EXE: ${{ github.workspace }}/classifier.exe
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage-full.xml \
            --cov-report=term-missing \
            --timeout=120

      # ─── 上傳覆蓋率報告 ───
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-go.out
          flags: go-unit
          name: go-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-full.xml
          flags: integration
          name: python-integration
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (test stage)
        run: |
          docker build \
            --target test \
            --tag actress-classifier:test \
            --progress=plain \
            .

      - name: Run tests inside Docker container
        run: |
          docker run --rm \
            actress-classifier:test \
            python -m pytest tests/ \
              -v \
              --tb=short \
              --timeout=60 \
              -x \
              || echo "⚠️ Docker 內部測試部分失敗"
